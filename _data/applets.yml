- slug: mixture-models
  source: mixture-models.html
  title: Gaussian Mixture and EM Explorer
  subtitle: Probabilistic clustering with latent structure and uncertainty.
  category: Unsupervised Learning
  visual: EM
  description: >
    Interactively fit a mixture model and observe how expectation-maximization
    alternates between assigning probability mass and updating component
    parameters. The applet makes soft clustering and uncertainty visible, which
    is central to segmentation problems where group membership is not obvious.
  skills:
    - EM algorithm
    - Mixture models
    - Clustering
    - Probabilistic modeling
    - Uncertainty
  challenge: Recovering latent groups when the data are noisy, overlapping, or partially ambiguous.
  contribution: Built a two-dimensional simulator that exposes the iterative mechanics behind soft clustering.
  transferable: Customer segmentation, anomaly grouping, market discovery, spatial analytics.
  related: Cosmic structure analysis and unsupervised pattern discovery.

- slug: hierarchical-clustering
  source: hierarchical-clustering.html
  title: Hierarchical Clustering Lab
  subtitle: Linkage choices, dendrograms, and multiscale structure.
  category: Unsupervised Learning
  visual: Hierarchy
  description: >
    Explore how hierarchical clustering builds structure from pairwise
    distances and linkage rules. The applet is useful for understanding why
    clustering is not one result but a modeling decision that depends on scale,
    distance, noise, and the structure one wants to preserve.
  skills:
    - Clustering
    - Linkage methods
    - Dendrograms
    - Distance metrics
    - Pattern discovery
  challenge: Identifying structure across scales without imposing a fixed number of groups too early.
  contribution: Built an interactive clustering view that connects local distances to global grouping decisions.
  transferable: Customer segmentation, document clustering, taxonomy design, operations analytics.
  related: Cosmic void detection and large-scale spatial structure analysis.

- slug: kernel-svm
  source: kernel-svm.html
  title: Kernel SVM Explorer
  subtitle: Nonlinear classification through similarity and margin control.
  category: Supervised Learning
  visual: Kernel
  description: >
    Adjust the kernel behavior and see how nonlinear decision regions form.
