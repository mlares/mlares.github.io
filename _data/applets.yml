- slug: roc-pr
  source: roc-pr.html
  title: ROC and Precision-Recall Explorer
  subtitle: Thresholds, class imbalance, and classification trade-offs.
  category: Model Evaluation
  visual: Metrics
  description: >
    Explore how ROC and Precision-Recall curves respond when prevalence, class
    separation, and decision thresholds change. The demo makes visible a common
    production ML risk: a model can look acceptable under one metric while
    failing the operating point that matters for the positive class.
  skills:
    - ROC
    - Precision-Recall
    - Class imbalance
    - Thresholds
    - Model evaluation
  challenge: Choosing metrics and thresholds when false positives and false negatives have different operational costs.
  contribution: Built an interactive simulator that links score distributions, confusion-matrix behavior, and evaluation curves.
  transferable: Fraud detection, medical triage, rare-event monitoring, ranking, recommender evaluation.
  related: TOROS rare-event detection and production model evaluation.

- slug: pca
  source: pca.html
  title: PCA Projection Explorer
  subtitle: Variance, projection, reconstruction, and information loss.
  category: Representation Learning
  visual: Projection
  description: >
    Manipulate a two-dimensional data cloud and observe how principal components
    rotate, project, and reconstruct the data. The applet gives a concrete view
    of what dimensionality reduction preserves, what it discards, and why that
    matters before feeding compressed representations into downstream models.
  skills:
    - PCA
    - Linear algebra
    - Dimensionality reduction
    - Feature compression
    - Reconstruction
  challenge: Reducing dimensionality without losing the structure needed for the task.
  contribution: Designed a visual explanation that connects covariance geometry to model-ready representations.
  transferable: Embeddings, denoising, exploratory analysis, feature engineering, scientific data reduction.
  related: VVV/VVVX feature extraction and DEEPz high-dimensional regression.

- slug: gradient-descent
  source: gradient-descent.html
  title: Gradient Descent Playground
  subtitle: Optimization paths, learning rates, and loss-surface behavior.
  category: Optimization
  visual: Loss Surface
  description: >
    Adjust optimization settings and watch how the path over a loss surface
    changes. The demo shows why learning rate, curvature, and initialization
    affect convergence, instability, and training time in machine learning
    systems.
  skills:
    - Optimization
    - Gradient descent
    - Numerical methods
    - Loss functions
    - Model training
  challenge: Making iterative optimization behavior visible enough to diagnose convergence failures.
  contribution: Built an interactive loss-surface view that connects parameter updates to model training dynamics.
  transferable: Deep learning, forecasting models, calibration, optimization-heavy analytics workflows.
  related: Production ML training workflows and statistical modeling.

- slug: bias-variance
  source: bias-variance.html
  title: Bias-Variance and Generalization
  subtitle: Model complexity, noise, and the gap between fitting and learning.
  category: Model Robustness
  visual: Generalization
  description: >
    Change model complexity and data conditions to see how training fit can
    diverge from generalization. The applet turns overfitting into an observable
    behavior rather than an abstract warning, making it useful for model
    selection and risk-aware validation.
  skills:
    - Generalization
    - Bias-variance
    - Validation
    - Model selection
    - Regularization
  challenge: Distinguishing useful flexibility from unstable fitting under noisy data.
  contribution: Created an interactive simulator for comparing training behavior with out-of-sample performance.
  transferable: Experiment design, forecasting, predictive maintenance, risk models, applied ML validation.
  related: Mercado Libre experimentation and robust scientific inference.

- slug: decision-boundaries
  source: decision-boundaries.html
  title: Decision Boundary Explorer
  subtitle: Comparing classifiers through the regions they assign.
  category: Supervised Learning
  visual: Boundaries
  description: >
    Compare how classifiers partition the same feature space under different
    assumptions. The visualization helps explain why model choice is not only
    about accuracy: geometry, noise, class overlap, and inductive bias shape the
    decisions a system will make.
  skills:
    - Classification
    - Decision boundaries
    - Supervised learning
    - Model comparison
    - Statistical learning
  challenge: Understanding how classifier assumptions translate into operational decisions.
  contribution: Built a visual comparison tool for linking model families to boundary geometry.
  transferable: Segmentation, risk scoring, customer modeling, medical classification, anomaly triage.
  related: Variable-star classification and production ML decision systems.

- slug: regularization
  source: regularization.html
  title: Regularization Explorer
  subtitle: Controlling model complexity with constraints and penalties.
  category: Model Robustness
  visual: Constraints
  description: >
    Visualize how regularization changes the feasible solutions and the models
    that emerge from data. The demo highlights the engineering role of
    regularization: not just improving metrics, but making models more stable,
    interpretable, and reliable under limited or noisy evidence.
  skills:
    - Regularization
    - L1/L2 penalties
    - Model stability
    - Feature selection
    - Regression
  challenge: Preventing models from becoming too sensitive to noise or weak signals.
  contribution: Created an interactive view of how penalty geometry shapes learned parameters.
  transferable: Risk estimation, price prediction, forecasting, sparse modeling, production regression.
