  skills:
    - SVM
    - RBF kernel
    - Nonlinear models
    - Margins
    - Classification
  challenge: Capturing nonlinear structure while preserving a stable decision rule.
  contribution: Built a visual tool for understanding how kernel parameters reshape the classifier boundary.
  transferable: Image classification, anomaly detection, quality control, risk models.
  related: Computer vision pipelines and automated object detection.

- slug: ensemble-variance
  source: ensemble-variance.html
  title: Ensemble Variance Explorer
  subtitle: Why averaging many learners can produce more stable predictions.
  category: Model Robustness
  visual: Ensemble
  description: >
    Compare individual noisy learners with their aggregate behavior. The applet
    shows the central intuition behind ensemble models: independent errors can
    partially cancel out, reducing variance and improving reliability without
    requiring every base model to be perfect.
  skills:
    - Ensembles
    - Random Forests
    - Variance reduction
    - Model stability
    - Bootstrap intuition
  challenge: Improving prediction stability when individual models are sensitive to the data sample.
  contribution: Created an interactive demonstration of variance reduction through aggregation.
  transferable: Random Forest modeling, forecasting, ranking, noisy industrial prediction systems.
  related: Random Forest classification in TOROS candidate ranking.

- slug: tree-instability
  source: tree-instability.html
  title: Decision Tree Instability
  subtitle: Small data changes, large boundary changes.
  category: Model Robustness
  visual: Trees
  description: >
    Observe how small perturbations in the training data can change a decision
    tree. The applet captures a practical issue in interpretable modeling:
    simple rules can be easy to explain, but their apparent clarity may hide
    sensitivity to sampling noise.
  skills:
    - Decision trees
    - Instability
    - Validation
    - Robustness
    - Interpretability
  challenge: Separating interpretable structure from unstable artifacts of a specific sample.
  contribution: Built a focused visualization of tree boundary sensitivity under small data changes.
  transferable: Credit policies, churn models, operational rules, interpretable ML governance.
  related: Model validation and production experimentation.

- slug: label-agreement
  source: label-agreement.html
  title: Agreement and Label Quality Explorer
  subtitle: Measuring annotation reliability beyond raw accuracy.
  category: Model Evaluation
  visual: Labels
  description: >
    Explore how inter-rater agreement changes under different labeling patterns.
    The applet highlights a frequent ML bottleneck: model quality is bounded by
    the reliability of the data labels, and agreement metrics can reveal
    problems that raw counts hide.
  skills:
    - Label quality
    - Cohen's kappa
    - Evaluation
    - Annotation workflows
    - Data quality
  challenge: Quantifying whether labels are consistent enough to support reliable model training and evaluation.
  contribution: Built a simulator for interpreting agreement metrics under changing base rates and disagreement patterns.
  transferable: Human-in-the-loop ML, annotation QA, medical review, content moderation, audit workflows.
  related: Human validation in TOROS and applied ML data quality work.
